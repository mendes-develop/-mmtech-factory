name: Agent task (Phase A)

# A human dispatches a task for a target repo (default: this repo). Claude Code
# edits the target on a fresh branch, and a DRAFT PR is opened there for human
# review. Never auto-merges. n8n dispatches this workflow later (see CLAUDE.md).
#
# Run tracking happens in two jobs that check out THIS repo's default branch,
# not the agent branch, so the agent cannot change the code that runs with
# MONGODB_URI.
#
# Token handling: FACTORY_TARGET_TOKEN is used only by git push and gh in
# explicit steps. It is never persisted to git config and never placed in the
# environment of the Claude step.

on:
  workflow_dispatch:
    inputs:
      task:
        description: Plain-language task for the agent
        required: true
        type: string
      branch_suffix:
        description: Short slug for the agent branch (agent/<slug>)
        required: true
        type: string
      target_repo:
        description: Repo to change, owner/name (default - this repo)
        required: false
        type: string
        default: ""
      validate_command:
        description: Shell command run in the target repo to validate changes (empty - none)
        required: false
        type: string
        default: ""
      issue_number:
        description: Issue number in the target repo this run is for (optional; digits only)
        required: false
        type: string
        default: ""
      allow_workflow_changes:
        description: Allow the agent to modify .github/ (default false)
        required: false
        type: boolean
        default: false

concurrency:
  group: agent-${{ inputs.target_repo || github.repository }}-${{ inputs.branch_suffix }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CLAUDE_CODE_VERSION: "2.1.317"
  BUN_VERSION: "1.3.0"

jobs:
  track-start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        continue-on-error: true
        run: bun install --frozen-lockfile

      - name: Record run start
        continue-on-error: true
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ inputs.target_repo || github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH: agent/${{ inputs.branch_suffix }}
          TASK: ${{ inputs.task }}
          ACTOR: ${{ github.actor }}
        run: bun scripts/track-run.ts start

  implement:
    needs: track-start
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Secrets (ANTHROPIC_API_KEY, FACTORY_TARGET_TOKEN) live in this environment.
    environment: main
    outputs:
      pr_url: ${{ steps.pr.outputs.url }}

    steps:
      - name: Check inputs
        env:
          TARGET: ${{ inputs.target_repo }}
          SLUG: ${{ inputs.branch_suffix }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          # Accept only safe values; none of these are interpolated into shell code.
          if [ -n "$TARGET" ] && [[ ! "$TARGET" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "target_repo must look like owner/name" >&2
            exit 1
          fi
          if [[ ! "$SLUG" =~ ^[a-z0-9][a-z0-9-]{0,48}$ ]]; then
            echo "branch_suffix must match ^[a-z0-9][a-z0-9-]{0,48}$" >&2
            exit 1
          fi
          if [[ ! "$ISSUE_NUMBER" =~ ^[0-9]*$ ]]; then
            echo "issue_number must be digits only" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo || github.repository }}
          token: ${{ secrets.FACTORY_TARGET_TOKEN || github.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Create agent branch
        working-directory: target
        env:
          SLUG: ${{ inputs.branch_suffix }}
        run: |
          git checkout -b "agent/${SLUG}"
          git config user.name "Software Factory"
          git config user.email "software-factory@users.noreply.github.com"

      - name: Claim agent branch
        # Atomic claim: a plain (non-force) push fails if another run already
        # pushed agent/<slug>, so only one run per slug proceeds. Never force.
        # The commit uses --no-verify so repo hooks never run beside the token.
        working-directory: target
        env:
          TOKEN: ${{ secrets.FACTORY_TARGET_TOKEN || github.token }}
          SLUG: ${{ inputs.branch_suffix }}
        run: |
          git commit --no-verify --allow-empty -m "claim agent/${SLUG} (run ${GITHUB_RUN_ID})"
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}"
          git push origin "HEAD:refs/heads/agent/${SLUG}"

      - name: Run Claude Code
        working-directory: target
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK: ${{ inputs.task }}
        run: |
          # TASK is passed via env, never interpolated into the shell script.
          # No GitHub token in this step's environment.
          claude -p "$TASK" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Write,Glob,Grep" \
            --max-turns 40 \
            --output-format text

      - name: Guard against workflow/security changes
        working-directory: target
        env:
          ALLOW: ${{ inputs.allow_workflow_changes }}
        run: |
          if [ "$ALLOW" != "true" ] && git status --porcelain -- .github/ | grep -q .; then
            echo "Agent modified .github/ without allow_workflow_changes. Aborting." >&2
            git status --porcelain -- .github/
            exit 1
          fi

      - name: Validate
        # Runs the command the dispatcher gave (empty means no validation).
        # No tokens in this step's environment.
        working-directory: target
        env:
          VALIDATE_COMMAND: ${{ inputs.validate_command }}
        run: |
          if [ -z "$VALIDATE_COMMAND" ]; then
            echo "No validate_command given; changes are NOT validated." >&2
            exit 0
          fi
          bash -c "$VALIDATE_COMMAND"

      - name: Commit changes
        working-directory: target
        env:
          SLUG: ${{ inputs.branch_suffix }}
          TASK: ${{ inputs.task }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Agent made no changes; no PR created." >&2
            exit 1
          fi
          git commit --no-verify -m "agent(${SLUG}): ${TASK:0:72}"

      - name: Push and open draft PR
        id: pr
        working-directory: target
        env:
          TOKEN: ${{ secrets.FACTORY_TARGET_TOKEN || github.token }}
          SLUG: ${{ inputs.branch_suffix }}
          TASK: ${{ inputs.task }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TARGET: ${{ inputs.target_repo || github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.FACTORY_TARGET_TOKEN || github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}"
          git push -u origin "HEAD:agent/${SLUG}"
          REF=""
          if [ -n "$ISSUE_NUMBER" ]; then
            REF="Refs #${ISSUE_NUMBER}"
          fi
          PR_URL=$(gh pr create \
            --repo "$TARGET" \
            --draft \
            --head "agent/${SLUG}" \
            --title "agent(${SLUG}): ${TASK:0:60}" \
            --body "Automated draft PR from agent workflow run ${RUN_ID} in ${TARGET}.

          Task: ${TASK}
          ${REF}

          Review and validate before merging. Nothing has been merged automatically.")
          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"

  track-finish:
    needs: implement
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        continue-on-error: true
        run: bun install --frozen-lockfile

      - name: Record run result
        continue-on-error: true
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ inputs.target_repo || github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH: agent/${{ inputs.branch_suffix }}
          TASK: ${{ inputs.task }}
          ACTOR: ${{ github.actor }}
          STATUS: ${{ needs.implement.result }}
          PR_URL: ${{ needs.implement.outputs.pr_url }}
        run: bun scripts/track-run.ts finish
